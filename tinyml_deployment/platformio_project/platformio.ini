; PlatformIO Configuration for Gesture Classifier on XIAO nRF52840
; Target: Seeed Studio XIAO nRF52840 (non-Sense)
; MCU: nRF52840 (Cortex-M4F @ 64MHz)
; RAM: 256KB (~220KB usable), Flash: 1MB + 2MB onboard
;
; Model Options:
;   1. Compressed M1 (CNN+LSTM): 45K params, ~80KB arena - FITS
;   2. M2 (CNN-only): 160K params, ~100KB arena - FITS
;   3. Original M1: 411K params, ~398KB arena - DOES NOT FIT
;
; This project uses Compressed M1 by default (CNN+LSTM that fits in RAM)

[env:xiao_nrf52840]
; Use Seeed's custom platform (REQUIRED for XIAO boards)
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
; Correct board name for XIAO nRF52840 (non-Sense)
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino

; Disable library archiving (required for TFLite Micro)
lib_archive = no

; Build configuration optimized for Compressed M1 TinyML
build_flags =
    ; Cortex-M4 with FPU optimizations (CRITICAL for performance)
    -mcpu=cortex-m4
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -mthumb
    -DARM_MATH_CM4
    -D__FPU_PRESENT=1

    ; TensorFlow Lite Micro settings
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    -DTFLITE_MICRO_ENABLED

    ; Memory optimization (CRITICAL - we have only 256KB RAM)
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-exceptions
    -fno-rtti
    -Wl,--gc-sections

    ; EMG Configuration for Compressed M1
    -DEMG_CHANNELS=7
    -DEMG_SAMPLE_RATE=2000
    -DWINDOW_SAMPLES=1000       ; 500ms @ 2kHz (reduced for RAM)
    -DNUM_GESTURES=9

    ; Tensor arena size for Compressed M1 (80KB)
    -DTENSOR_ARENA_SIZE=81920

    ; Board identification
    -DSEEED_XIAO_NRF52840
    -DNRF52840_XXAA

    ; Model selection: Compressed M1 CNN+LSTM
    -DUSE_COMPRESSED_M1=1

; Upload settings
upload_speed = 115200

; Serial monitor
monitor_speed = 115200
monitor_filters =
    colorize
    time

; Library dependencies
lib_deps =
    ; TensorFlow Lite Micro for Arduino
    https://github.com/tensorflow/tflite-micro-arduino-examples.git

; Library compatibility
lib_compat_mode = off


; Alternative: Use M2 CNN-only model (recommended for nRF52840)
; LSTM requires too much RAM (398KB+), CNN fits easily
[env:xiao_nrf52840_cnn]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
lib_archive = no

build_flags =
    -mcpu=cortex-m4
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -mthumb
    -DARM_MATH_CM4
    -D__FPU_PRESENT=1
    -DTF_LITE_STATIC_MEMORY
    -DTFLITE_MICRO_ENABLED
    -DUSE_CNN_MODEL=1
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-exceptions
    -fno-rtti
    -Wl,--gc-sections
    -DEMG_CHANNELS=7
    -DEMG_SAMPLE_RATE=2000
    -DWINDOW_SAMPLES=1000
    -DNUM_GESTURES=9

lib_deps =
    https://github.com/tensorflow/tflite-micro-arduino-examples.git

monitor_speed = 115200


; ============================================================
; M1 4-Channel TinyML Model (99.59% accuracy) - RECOMMENDED
; Uses NATIVE inference (no TFLite) - optimized for nRF52840
; Best option for XIAO nRF52840 - uses all 4 ADC channels optimally
; ============================================================
[env:xiao_nrf52840_4channel]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino

; No TFLite library needed - using native inference
lib_archive = no

build_flags =
    ; Cortex-M4 with FPU optimizations (CRITICAL for LSTM performance)
    -mcpu=cortex-m4
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -mthumb
    -DARM_MATH_CM4
    -D__FPU_PRESENT=1

    ; Memory optimization (CRITICAL - we have only 256KB RAM)
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-exceptions
    -fno-rtti
    -Wl,--gc-sections

    ; M1 4-Channel Native Inference Configuration
    -DUSE_M1_4CHANNEL=1
    -DEMG_CHANNELS=4
    -DEMG_SAMPLE_RATE=2000
    -DWINDOW_SAMPLES=2000       ; 1.0s @ 2kHz
    -DNUM_GESTURES=9

    ; Board identification
    -DSEEED_XIAO_NRF52840
    -DNRF52840_XXAA

; No lib_deps needed - native inference uses only standard Arduino

upload_speed = 115200
monitor_speed = 115200
monitor_filters =
    colorize
    time


; Debug configuration
[env:xiao_nrf52840_debug]
extends = env:xiao_nrf52840
build_type = debug
build_flags =
    ${env:xiao_nrf52840.build_flags}
    -DDEBUG
    -g3
    -ggdb

monitor_filters =
    colorize
    time
    log2file
