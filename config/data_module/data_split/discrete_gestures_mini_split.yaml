# Custom split using only available users (0, 1, 2)
# Since only test data exists for these users, we'll use test data for all splits
# This is a workaround for the limited dataset

_target_: generic_neuromotor_interface.data.DataSplit

train:
  discrete_gestures_user_000_dataset_000:
    - [0, .inf]  # Use all available data
  discrete_gestures_user_001_dataset_000:
    - [0, .inf]
val:
  discrete_gestures_user_002_dataset_000:
    - [0, .inf]
test:
  discrete_gestures_user_002_dataset_000:
    - [0, .inf]
