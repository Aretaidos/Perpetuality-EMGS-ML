# M1 4-Channel TinyML: Optimized CNN+LSTM for XIAO nRF52840 Deployment
#
# This configuration trains a 4-channel TinyML model optimized for the
# Seeed Studio XIAO nRF52840 (non-Sense) microcontroller.
#
# Hardware Target:
#   - Device: Seeed Studio XIAO nRF52840 (non-Sense)
#   - CPU: ARM Cortex-M4F @ 64MHz
#   - RAM: 256KB total (~220KB usable)
#   - Flash: 1MB + 2MB onboard
#   - ADC: 4 channels maximum
#
# Architecture:
#   Conv1d(4, 72, k=15, s=10) -> BatchNorm -> ReLU -> Dropout(0.3)
#   -> LSTM(72, 48, 2 layers) -> LayerNorm -> FC(9)
#
# Memory Estimates (INT8 quantized, 2000 sample window):
#   - Parameters: ~47,300
#   - Model size: ~47KB
#   - Runtime: ~208KB (fits in 220KB)
#
# 4-Channel Selection (flexor-extensor balance, 66.2% importance):
#   - Ch7 (idx 6): Index flexor (24.5%) - press
#   - Ch8 (idx 7): Ring flexor (13.2%) - press
#   - Ch13 (idx 12): Index/middle extensor (19.8%) - release
#   - Ch15 (idx 14): Ring/pinky extensor (8.7%) - release
#
# Expected Performance: 83-88% accuracy

defaults:
  - data_module/data_split: discrete_gestures_split
  - _self_

# Task identification
task: discrete_gestures_m1_4channel_tinyml
seed: 42
train: true
eval: true

# Data paths
data_location: ~/emg_data

# Data module configuration
data_module:
  _target_: generic_neuromotor_interface.data_module.WindowedEmgDataModule

  # Window parameters optimized for TinyML (fits in 220KB)
  window_length: 2000     # 1.0 second at 2kHz
  stride: 1000            # 0.5 second stride (50% overlap)
  batch_size: 64          # Larger batches for faster training
  num_workers: 0          # 0 workers to avoid HDF5 pickling issues
  data_location: ${data_location}

  # Transform with 4 isolated channels (0-BASED indices!)
  transform:
    _target_: generic_neuromotor_interface.transforms_isolated.Isolated4ChannelTransform
    pulse_window: [0.0, 0.04]  # 0-40ms pulse window
    channel_indices: [6, 7, 12, 14]  # Ch7, Ch8, Ch13, Ch15 (1-based)

# Lightning module configuration (M1 4-Channel TinyML)
lightning_module:
  _target_: generic_neuromotor_interface.lightning.DiscreteGesturesModule

  # Network architecture - optimized for 4 channels
  network:
    _target_: generic_neuromotor_interface.networks_isolated.M1_4Channel_TinyML
    input_channels: 4         # 4 isolated channels
    conv_output_channels: 72  # Balanced for accuracy vs memory
    kernel_width: 15          # 7.5ms at 2kHz
    stride: 10                # Downsample to 200Hz
    lstm_hidden_size: 48      # Reduced for memory fit (2-layer LSTM)
    lstm_num_layers: 2        # KEY: 2 layers (not 1!) for temporal patterns
    output_channels: 9        # 9 gesture classes
    dropout: 0.3              # Higher dropout for regularization

  # Optimizer - AdamW with weight decay
  optimizer: torch.optim.AdamW
  learning_rate: 0.001
  weight_decay: 0.01

  # Learning rate schedule - OneCycleLR for better convergence
  lr_scheduler_milestones: [30, 60, 80]
  lr_scheduler_factor: 0.5

  # Warmup
  warmup_start_factor: 0.0001
  warmup_end_factor: 1.0
  warmup_total_epochs: 5

  # Gradient clipping
  gradient_clip_val: 1.0

# Trainer configuration
trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 4              # Multi-GPU DDP training
  strategy: ddp           # Distributed Data Parallel
  precision: 16-mixed     # Mixed precision for faster training
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  enable_checkpointing: true
  default_root_dir: ./checkpoints_4channel

# Callbacks
callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_accuracy
    mode: max
    save_top_k: 3
    filename: "m1_4channel-epoch={epoch:02d}-val_acc={val_accuracy:.3f}"
    save_last: true

  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: epoch

  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_loss
    patience: 25
    mode: min

  # Gradient monitoring for debugging
  - _target_: pytorch_lightning.callbacks.DeviceStatsMonitor
    cpu_stats: false
