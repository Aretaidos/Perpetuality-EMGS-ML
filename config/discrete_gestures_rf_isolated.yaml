# Random Forest model configuration for isolated channels
# Note: This model uses scikit-learn and requires a separate training script
# See: generic_neuromotor_interface/scripts/train_random_forest.py

# Data settings
data_location: ~/emg_data
task: discrete_gestures_rf_isolated

# Model settings
model:
  n_estimators: 200
  max_depth: null  # None = unlimited
  min_samples_split: 5
  n_channels: 7  # Isolated: 7 channels instead of 16
  fs: 200.0  # Sampling frequency in Hz

# Channel configuration
channel_indices: [9, 8, 7, 6, 5, 13, 15]  # Isolated channels from importance analysis

# Data split settings (same as discrete gestures)
data_split:
  train_users: [0, 1]
  val_users: [2]
  test_users: [2]

