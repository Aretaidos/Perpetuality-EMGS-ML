# M1 4-Channel Efficient: Pure CNN for Fast Desktop Inference (Variant 3)
#
# This configuration trains a pure CNN model optimized for extremely fast
# inference on desktop CPUs. Replaces LSTM with dilated and depthwise
# separable convolutions.
#
# Architecture:
#   Conv1d(4→48, k=15, s=10) → BatchNorm → ReLU → Dropout
#   → DilatedConv(48→64, k=7, d=2) → BatchNorm → ReLU → Dropout
#   → DepthwiseSep(64→96, k=11) → BatchNorm → ReLU → Dropout
#   → Conv1d(96→128, k=5, s=2) → BatchNorm → ReLU
#   → Conv1d(128→64, k=3) → BatchNorm → ReLU → Dropout
#   → Conv1d(64→9, k=1)
#
# Parameters: ~120K
# Expected Accuracy: 98.0-99.0% (slight drop vs LSTM for massive speed gain)
# Inference Time: 2-3ms CPU (5-10× faster than LSTM variants!)
#
# Key Innovation:
#   - NO LSTM - eliminates sequential bottleneck
#   - Dilated convolutions for long-range temporal context (65ms)
#   - Depthwise separable conv for efficient multi-scale features
#   - Fully parallelizable across timesteps
#
# Training Configuration:
#   - 1x GPU (fast training, low memory)
#   - Expected time: 15-20 minutes
#   - Larger batch size possible (no LSTM memory)

defaults:
  - data_module/data_split: discrete_gestures_split
  - _self_

# Task identification
task: discrete_gestures_m1_4channel_efficient
seed: 42
train: true
eval: true

# Data paths
data_location: ~/emg_data

# Data module configuration
data_module:
  _target_: generic_neuromotor_interface.data_module.WindowedEmgDataModule

  # Window parameters
  window_length: 2000     # 1.0 second at 2kHz
  stride: 1000            # 0.5 second stride (50% overlap)
  batch_size: 128         # Larger batch size (CNN uses less memory)
  num_workers: 0          # 0 workers for HDF5 compatibility
  data_location: ${data_location}

  # Transform with 4 isolated channels
  transform:
    _target_: generic_neuromotor_interface.transforms_isolated.Isolated4ChannelTransform
    pulse_window: [0.0, 0.04]
    channel_indices: [6, 7, 12, 14]  # Ch7, Ch8, Ch13, Ch15

# Lightning module configuration
lightning_module:
  _target_: generic_neuromotor_interface.lightning.DiscreteGesturesModule

  # Network architecture - pure CNN for speed
  network:
    _target_: generic_neuromotor_interface.networks_isolated.M1_4Channel_Efficient
    input_channels: 4

    # Conv layers
    conv1_channels: 48          # Initial conv
    dilated_channels: 64        # Dilated temporal conv
    depthwise_channels: 96      # After depthwise separable
    refined_channels: 128       # After temporal pooling
    head_channels: 64           # Classification head

    # Output
    output_channels: 9
    dropout: 0.2                # Lower dropout (CNNs regularize naturally)

  # Optimizer - higher LR for CNN-only (no recurrent gradient issues)
  optimizer: torch.optim.AdamW
  learning_rate: 0.002
  weight_decay: 0.01

  # Faster LR schedule for CNN convergence
  lr_scheduler_milestones: [30, 60, 80]
  lr_scheduler_factor: 0.5

  # Shorter warmup (CNNs converge faster)
  warmup_start_factor: 0.001
  warmup_end_factor: 1.0
  warmup_total_epochs: 3

  # Gradient clipping
  gradient_clip_val: 1.0

# Trainer configuration
trainer:
  max_epochs: 100         # CNNs may need more epochs to match LSTM accuracy
  accelerator: gpu
  devices: 1              # Single GPU sufficient (fast training)
  strategy: auto          # Auto strategy for single GPU
  precision: 16-mixed
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  enable_checkpointing: true
  default_root_dir: ./checkpoints_4channel_efficient

# Callbacks
callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_accuracy
    mode: max
    save_top_k: 3
    filename: "m1_4ch_efficient-epoch={epoch:02d}-val_acc={val_accuracy:.3f}"
    save_last: true

  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: epoch

  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_loss
    patience: 20
    mode: min

  - _target_: pytorch_lightning.callbacks.DeviceStatsMonitor
    cpu_stats: false
